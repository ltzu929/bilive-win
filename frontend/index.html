<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bilive 工作台</title>
  <link rel="stylesheet" href="/assets/styles.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">Bilive</div>
      <nav class="nav" id="nav">
        <a class="nav-item" data-page="library" href="#/library">
          <span class="ico"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><polygon points="10,9 16,12 10,15"/></svg></span>
          录播库
        </a>
        <a class="nav-item" data-page="live" href="#/live">
          <span class="ico"><svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></svg></span>
          直播间
        </a>
        <a class="nav-item" data-page="publish" href="#/publish">
          <span class="ico"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 9h8M8 12h8M8 15h5"/></svg></span>
          发布队列
        </a>
        <a class="nav-item" data-page="streamer" href="#/streamer">
          <span class="ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 19c1.5-3.5 4-5 7-5s5.5 1.5 7 5"/></svg></span>
          主播档案
        </a>
        <a class="nav-item" data-page="recycle" href="#/recycle">
          <span class="ico"><svg viewBox="0 0 24 24"><path d="M5 7h14l-1 12H6L5 7z"/><path d="M9 7V5h6v2"/><path d="M10 11v5M14 11v5"/></svg></span>
          录播回收
        </a>
      </nav>
      <div class="sidebar-foot">
        <a class="nav-item foot" data-page="settings" href="#/settings">
          <span class="ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v2.2M12 18.8V21M3 12h2.2M18.8 12H21M5.6 5.6l1.6 1.6M16.8 16.8l1.6 1.6M18.4 5.6l-1.6 1.6M7.2 16.8l-1.6 1.6"/></svg></span>
          设置
        </a>
        <div class="service-dot"><i></i> 本机服务正常</div>
      </div>
    </aside>

    <main class="main" id="main"></main>
  </div>
  <script src="/assets/app.js"></script>
</body>
</html>
