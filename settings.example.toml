version = "1.0"
webhooks = []
tasks = []

[output]
path_template = "{roomid} - {uname}/{roomid}_{year}{month}{day}-{hour}-{minute}-{second}"
filesize_limit = 0
duration_limit = 0
out_dir = "./Videos"

[logging]
log_dir = "./logs/record"
console_log_level = "INFO"
backup_count = 30

[header]
cookie = ""

[danmaku]
danmu_uname = false
record_gift_send = true
record_free_gifts = true
record_guard_buy = true
record_super_chat = true
save_raw_danmaku = false

[recorder]
stream_format = "flv"
recording_mode = "standard"
quality_number = 20000
read_timeout = 3
disconnection_timeout = 600
buffer_size = 8192
save_cover = false

[postprocessing]
# Worker owns validated remux; native postprocessing must preserve FLV.
remux_to_mp4 = false
inject_extra_metadata = false
delete_source = "never"

[space]
check_interval = 60
space_threshold = 1073741824
recycle_records = false
