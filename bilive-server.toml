# Bilive 服务配置（可入库默认值）
# 机器绝对路径与秘密不得写入本文件。优先级：环境变量 > 配置文件 > 默认值。

[worker]
idle_timeout = 900
idle_check_interval = 30

[video]
min_source_size_mb = 100

[slice.burst]
ratio = 3.0
window = 10
context = 120
merge_gap = 5
top_n = 3
lag = 0

[slice.mimo]
model = "mimo-v2.5"
fps = 1
media_resolution = "default"
timeout = 180
max_base64_bytes = 48000000
request_concurrency = 3
encode_concurrency = 1

[slice.quality]
quality = 0.80
completeness = 0.80
confidence = 0.80

[slice.analysis]
auto_start = false
pre_judge_asr = true
asr_prompt_max_chars = 4000

[slice.multi_modal]
# ASR 细节沿用旧配置域；视觉判断由 slice.mimo 配置。
whisper_engine = "faster-whisper"
whisper_vad_min_silence_ms = 2000
whisper_vad_speech_pad_ms = 400
unload_audio_model_after_analysis = true

[slice.subtitle]
asr_model = "large-v3"
asr_device = "cuda"
asr_compute_type = "float16"
asr_batch = 8
asr_cpu_threads = 8
asr_vad = true
padding = 6.0
snap_tolerance = 3.0
light_correct = true

[slice.edit]
font_family = "Noto Sans SC"
font_size = 20
margin_v = 60

[upload]
auto_start = true
poll_interval = 10
max_attempts = 3
retry_base = 30
auth_retry = 120
delete_after_success = true

[dashboard]
# 允许的额外请求 Host，修改后重启；不放宽同源写入规则。
allowed_hosts = []

[publication]
title_template = "{title}"
description = ""
tags = []

[retention]
# 新策略先保存为关闭；从设置页启用后才自动执行，避免部署即回收历史源。
enabled = false
unprocessed_days = 5
published_hours = 24
